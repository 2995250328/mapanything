defaults:
  - default

# Number of views parameter for the multi-view datasets
num_views: 4

train:
  # If True, the number of views can vary from batch to batch. The maximum number of views is num_views and minimum is 2. (On by default for N-view training)
  variable_num_views: true

# Train Resolution
resolution_train: ${dataset.resolution_options.518_1_33_ar}

# Validation Resolution
resolution_test_seven_scenes: ${dataset.resolution_options.518_1_33_ar}

sample_specific_scene: True
specific_scene_name: 'chess_train'

# Training Set
train_dataset:
  "${dataset.seven_scenes_wai.train.dataset_str}"

# Validation Set
test_dataset:
  "${dataset.seven_scenes_wai.test.dataset_str}"
