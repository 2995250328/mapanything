# @package _global_

defaults:
  - /machine: default
  - /model: map-anything
  - /model/task: images_only
  # 使用一个肯定包含 dataset_str 的默认数据集
  - /dataset: seven_scenes_wai/test/default
  - _self_

# [系统路径提升]
# 将 machine 配置中的关键路径提升到顶层，方便命令行插值
root_data_dir: ${machine.root_data_dir}
mapanything_dataset_metadata_dir: ${machine.mapanything_dataset_metadata_dir}
root_pretrained_checkpoints_dir: ${machine.root_pretrained_checkpoints_dir}
root_experiments_dir: ${machine.root_experiments_dir}

# [Demo 参数]
demo:
  device: "cuda"
  num_samples: None
  output_dir: "${hydra:run.dir}/reconstruction"
  memory_efficient_inference: false
  sample_indices: null

# [Fusion 参数 (必需)]
fusion:
  stored_feature_file: ???  # 必须在命令行指定

# [Pipeline 参数 (默认值)]
single_view:
  include_intrinsics: True
  include_depth: False
  include_pose: True
  include_scale: False