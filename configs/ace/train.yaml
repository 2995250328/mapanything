defaults:
  - machine: aws
  - model: mapanything
  - _self_

output_dir: ${hydra:run.dir}
root_data_dir: ${machine.root_data_dir}
mapanything_dataset_metadata_dir: ${machine.mapanything_dataset_metadata_dir}
root_pretrained_checkpoints_dir: ${machine.root_pretrained_checkpoints_dir}

fusion:
  stored_feature_file: ???
  memory_keep_ratio: 1.0
  memory_efficient_inference: false

dataset:
  dataset_str: >-
    SevenScenesWAI(num_views=1, split="train", covisibility_thres=0.025,
    ROOT='${root_data_dir}/wai_data/7scenes', dataset_metadata_dir='${mapanything_dataset_metadata_dir}',
    sample_specific_scene=false, resolution=[518, 392], transform="imgnorm",
    data_norm_type="dinov2", seed=777)

model:
  model_str: ${model.model_str}
  model_config: ${model.model_config}
  pretrained: ${root_pretrained_checkpoints_dir}/facebook_map-anything.pth

training:
  device: cuda
  output_dir: ${output_dir}/ace_regression
  max_epochs: 5
  log_interval: 10
  lr: 1e-4
  weight_decay: 1e-4
  batch_size: 4
  num_workers: 2
  samples_per_view: 512
  max_buffer_views: 64
  buffer_capacity: 8192
  shuffle: true
  memory_efficient_inference: false

loss:
  reprojection_weight: 1.0
  xyz_weight: 0.1
  confidence_weight: 1.0

head:
  hidden_dim: 128
